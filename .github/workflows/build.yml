name: Build, Test & Publish

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
  # No paths-ignore: "Lint" and "Test" are required checks and must report on every PR
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (e.g. v1.2.0). Leave empty to only build and publish :main."
        required: false
        type: string

permissions:
  contents: read

# Runs on main are serialized: the release version is decided before the images
# are built, so two overlapping runs must not compute the same next version.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  # linux/arm/v7 is required: backup nodes are 32-bit Raspberry Pis
  PLATFORMS: linux/amd64,linux/arm64,linux/arm/v7
  GO_VERSION: "1.27"
  # renovate: datasource=github-releases depName=golangci/golangci-lint
  GOLANGCI_LINT_VERSION: v2.14.0
  # renovate: datasource=docker depName=ghcr.io/gitleaks/gitleaks
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f

jobs:
  # ----------------------------------------------------------
  # Lint: golangci-lint, go vet and a gitleaks scan of the full history
  # ----------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

      - name: go vet
        run: go vet ./...

      - name: gitleaks
        run: docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/repo" "$GITLEAKS_IMAGE" git /repo --redact --no-banner

  # ----------------------------------------------------------
  # Test: race-enabled unit tests, plus a 32-bit run (the Pi nodes are arm/v7)
  # ----------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Unit tests (race detector)
        run: go test -race ./...

      - name: Unit tests (32-bit)
        run: GOARCH=386 go test ./...

  # ----------------------------------------------------------
  # Images: build both images for every platform (pull requests only; main publishes them)
  # ----------------------------------------------------------
  images:
    name: Images
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [primary, node]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          # Shared runners hit Docker Hub's anonymous pull limit (HTTP 429)
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: build/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          build-args: |
            TARGET=${{ matrix.target }}
          push: false
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  # ----------------------------------------------------------
  # Release check: decide whether this merge releases, and the version.
  # Decided BEFORE publishing because the primary embeds its version as the
  # default node image tag used when provisioning new nodes.
  # ----------------------------------------------------------
  release-check:
    name: Release check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Decide
        id: check
        env:
          VERSION_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          if [[ -n "$VERSION_TAG" ]]; then
            if [[ ! "$VERSION_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::release_tag must look like v1.2.3 (got ${VERSION_TAG})"
              exit 1
            fi
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            CHANGED="$(git diff --name-only HEAD~1 HEAD)"
            SUBJECT="$(git log -1 --format=%s)"
            BODY="$(git log -1 --format=%b)"
            echo "Subject: ${SUBJECT}"
            echo "Changed files:"; echo "${CHANGED}"
            if ! grep -qE '^(go\.mod|go\.sum|build/Dockerfile|cmd/|internal/)' <<< "$CHANGED"; then
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # Conventional commit subject decides the bump; anything else (e.g. Renovate) is a patch
            if [[ "$SUBJECT" =~ ^[a-z]+(\([^\)]*\))?!: ]] || grep -q '^BREAKING CHANGE' <<< "$BODY"; then
              BUMP="major"
            elif [[ "$SUBJECT" =~ ^feat(\([^\)]*\))?: ]]; then
              BUMP="minor"
            else
              BUMP="patch"
            fi
            LATEST=$(git tag --list 'v*' | sed 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
            IFS=. read -r MAJ MIN PAT <<< "${LATEST:-0.0.0}"
            case "$BUMP" in
              major) VERSION_TAG="v$((MAJ + 1)).0.0" ;;
              minor) VERSION_TAG="v${MAJ}.$((MIN + 1)).0" ;;
              *)     VERSION_TAG="v${MAJ}.${MIN}.$((PAT + 1))" ;;
            esac
            echo "Auto release (${BUMP}): v${LATEST} -> ${VERSION_TAG}"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git rev-parse -q --verify "refs/tags/${VERSION_TAG}" >/dev/null; then
            echo "::error::Tag ${VERSION_TAG} already exists"
            exit 1
          fi
          {
            echo "release=true"
            echo "tag=${VERSION_TAG}"
            echo "version=${VERSION_TAG#v}"
          } >> "$GITHUB_OUTPUT"

  # ----------------------------------------------------------
  # Publish: push :main and :sha-<commit> of both images for every build of main
  # ----------------------------------------------------------
  publish:
    name: Publish ${{ matrix.target }}
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [lint, test, release-check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        target: [primary, node]
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/offsite-backup-manager-${{ matrix.target }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Embedded version
        id: version
        env:
          RELEASE_VERSION: ${{ needs.release-check.outputs.version }}
        run: |
          # Releases embed X.Y.Z (the primary then provisions nodes with node:X.Y.Z);
          # other builds embed sha-<commit>, which is also a published node tag.
          echo "version=${RELEASE_VERSION:-sha-${GITHUB_SHA::7}}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=main
            type=sha,prefix=sha-,format=short

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: build/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          build-args: |
            TARGET=${{ matrix.target }}
            VERSION=${{ steps.version.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # ----------------------------------------------------------
  # Release: tag the exact images published above and create a GitHub release
  # ----------------------------------------------------------
  release:
    name: Release
    if: >-
      !cancelled() && needs.publish.result == 'success' &&
      needs.release-check.outputs.release == 'true'
    needs: [publish, release-check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag images
        env:
          VERSION: ${{ needs.release-check.outputs.version }}
        run: |
          {
            echo '```sh'
            for TARGET in primary node; do
              IMAGE="${REGISTRY}/offsite-backup-manager-${TARGET}"
              docker buildx imagetools create \
                -t "${IMAGE}:${VERSION}" \
                -t "${IMAGE}:${VERSION%.*}" \
                -t "${IMAGE}:${VERSION%%.*}" \
                -t "${IMAGE}:latest" \
                "${IMAGE}:sha-${GITHUB_SHA::7}"
              echo "docker pull ${IMAGE}:${VERSION}"
            done
            echo '```'
            echo
            for TARGET in primary node; do
              IMAGE="${REGISTRY}/offsite-backup-manager-${TARGET}"
              DIGEST=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{.Manifest.Digest}}')
              echo "- \`offsite-backup-manager-${TARGET}\` digest: \`${DIGEST}\`"
            done
          } > "${RUNNER_TEMP}/notes.md"
          cat "${RUNNER_TEMP}/notes.md"

      - name: Create git tag
        env:
          TAG: ${{ needs.release-check.outputs.tag }}
        run: |
          git tag "$TAG"
          git push origin "$TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ needs.release-check.outputs.tag }}
          name: ${{ needs.release-check.outputs.tag }}
          body_path: ${{ runner.temp }}/notes.md
          generate_release_notes: true
          make_latest: true

  # ----------------------------------------------------------
  # Notify: bot-triggered runs on main email nobody, so open an issue
  # ----------------------------------------------------------
  notify-failure:
    name: Notify failure
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, test, release-check, publish, release]
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Open or update CI failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          TITLE="CI failed on main"
          BODY="Run: ${RUN_URL}
          Commit: ${GITHUB_SHA::7} $(head -1 <<< "$COMMIT_MSG")"
          EXISTING=$(gh issue list --state open --search "in:title \"${TITLE}\"" --json number --jq '.[0].number')
          if [[ -n "$EXISTING" ]]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY" --assignee "$OWNER"
          fi
